<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Labirinto interativo - Parte 1</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; color: #111; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .controles, .botoes { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 10px; }
  .area { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  table.grade { border-collapse: collapse; font-family: monospace; }
  table.grade td { width: 22px; height: 22px; text-align: center; border: 1px solid #ccc; font-size: 13px; padding: 0; }
  td.parede { background: #333; color: #333; }
  td.lama { background: #c9a77c; }
  td.agua { background: #8ec5ff; }
  td.chave { background: #ffe066; font-weight: bold; }
  td.porta { background: #ffa94d; font-weight: bold; }
  td.bonus { background: #8ce99a; font-weight: bold; }
  td.fonte { background: #f783ac; font-weight: bold; }
  td.esteira { background: #dee2e6; font-weight: bold; }
  td.inicio, td.saida { background: #b2f2bb; font-weight: bold; }
  td.fora { opacity: 0.25; }
  td.armadilha { outline: 3px solid #e03131; outline-offset: -3px; }
  td.visitada { box-shadow: inset 0 0 0 3px #4dabf7; }
  td.atual { background: #1c7ed6 !important; color: #fff; }
  .painel { border: 1px solid #999; padding: 10px 14px; min-width: 260px; }
  .painel p { margin: 4px 0; }
  .msg { margin-top: 8px; padding: 8px; background: #fff3bf; border: 1px solid #fab005; }
  .legenda { font-size: 13px; margin-top: 10px; }
  .legenda span { display: inline-block; width: 14px; height: 14px; vertical-align: middle; margin-right: 4px; border: 1px solid #999; }
</style>
</head>
<body>
<h1>Labirinto interativo - Parte 1 (grafo de estados)</h1>

<div class="controles">
  <label>Mapa: <select id="selMapa"></select></label>
  <label>Algoritmo: <select id="selAlg"></select></label>
  <label>Camada (chaves): <select id="selCamada"></select></label>
  <label><input type="checkbox" id="chkArmadilha"> Realcar estados-armadilha</label>
</div>

<div class="botoes">
  <button id="btnInicio">|&lt; Inicio</button>
  <button id="btnVoltar">&lt; Passo</button>
  <button id="btnPlay">Play</button>
  <button id="btnAvancar">Passo &gt;</button>
  <span>Velocidade:
    <label><input type="radio" name="velocidade" value="1000"> lenta</label>
    <label><input type="radio" name="velocidade" value="400" checked> normal</label>
    <label><input type="radio" name="velocidade" value="120"> rapida</label>
    <label><input type="radio" name="velocidade" value="15"> muito rapida</label>
  </span>
</div>

<div class="area">
  <table class="grade" id="grade"></table>
  <div class="painel">
    <p><b>Status:</b> <span id="rdStatus"></span></p>
    <p><b>Passo:</b> <span id="rdPasso"></span></p>
    <p><b>Posicao:</b> <span id="rdPosicao"></span></p>
    <p><b>Chaves:</b> <span id="rdChaves"></span></p>
    <p><b>Bonus consumidos:</b> <span id="rdBonus"></span></p>
    <p><b>Custo acumulado:</b> <span id="rdCusto"></span></p>
    <p><b>Estado:</b> <code id="rdEstado"></code></p>
    <p><b>Camada mostrada:</b> <span id="rdCamada"></span></p>
    <div class="msg" id="msg" hidden></div>
    <div class="legenda">
      <div><span style="background:#1c7ed6"></span>posicao atual
        <span style="box-shadow: inset 0 0 0 3px #4dabf7"></span>ja visitada</div>
      <div><span style="outline:3px solid #e03131; outline-offset:-3px"></span>estado-armadilha na camada mostrada</div>
      <div><span style="opacity:0.25; background:#999"></span>casa que nao existe na camada mostrada</div>
    </div>
  </div>
</div>

<script>
// dados gerados pelo src/solve.py (gerar_pagina_interativa)
const DADOS = /*DADOS*/{};
// mapa em que a pagina abre (o cli coloca aqui o --mapa; vazio = primeiro da lista)
const MAPA_INICIAL = /*MAPA_INICIAL*/"";

const NOMES_ALG = {
  BFS: "BFS (menos passos)",
  DFS: "DFS (um caminho qualquer)",
  DIJKSTRA: "Dijkstra (menor custo)",
  BELLMAN_FORD: "Bellman-Ford (menor custo, aceita negativo)",
  BELLMAN_FORD_FONTE_CONSUMIVEL: "Bellman-Ford com fonte consumivel",
};
const CLASSES = {
  "#": "parede", ",": "lama", "~": "agua", "+": "bonus", "*": "fonte",
  S: "inicio", G: "saida", ">": "esteira", "<": "esteira", "^": "esteira", v: "esteira",
};

let mapa = null;        // dados do mapa escolhido
let resultado = null;   // dados do algoritmo escolhido
let passo = 0;
let timer = null;

const $ = (id) => document.getElementById(id);

function classeDaCasa(simbolo) {
  if ("abcd".includes(simbolo)) return "chave";
  if ("ABCD".includes(simbolo)) return "porta";
  return CLASSES[simbolo] || "";
}

function chavesTexto(chaves) {
  return chaves === "-" ? "nenhuma" : chaves.split("").join(", ");
}

function montarGrade() {
  const grade = $("grade");
  grade.innerHTML = "";
  mapa.grade.forEach((linha, l) => {
    const tr = document.createElement("tr");
    [...linha].forEach((simbolo, c) => {
      const td = document.createElement("td");
      td.id = `c-${l}-${c}`;
      td.textContent = simbolo === "." ? "" : simbolo;
      td.className = classeDaCasa(simbolo);
      td.title = `(${l},${c})`;
      tr.appendChild(td);
    });
    grade.appendChild(tr);
  });
}

function camadaMostrada() {
  // "seguir" usa as chaves do passo atual
  const escolha = $("selCamada").value;
  if (escolha !== "seguir") return escolha;
  const atual = resultado.percurso[passo];
  return atual ? atual[2] : "-";
}

function desenhar() {
  const percurso = resultado.percurso;
  const atual = percurso[passo];
  const camada = camadaMostrada();
  const naCamada = new Set((mapa.camadas[camada] || []).map(([l, c]) => `${l}-${c}`));
  const armadilhas = new Set(
    mapa.armadilhas.filter(([l, c, k]) => k === camada).map(([l, c]) => `${l}-${c}`)
  );
  const visitadas = new Set(percurso.slice(0, passo).map(([l, c]) => `${l}-${c}`));

  mapa.grade.forEach((linha, l) => {
    [...linha].forEach((simbolo, c) => {
      const td = $(`c-${l}-${c}`);
      const chave = `${l}-${c}`;
      td.classList.toggle("fora", simbolo !== "#" && !naCamada.has(chave));
      td.classList.toggle("armadilha", $("chkArmadilha").checked && armadilhas.has(chave));
      td.classList.toggle("visitada", visitadas.has(chave));
      td.classList.toggle("atual", !!atual && atual[0] === l && atual[1] === c);
    });
  });

  mostrarMensagem();
  $("rdStatus").textContent = resultado.status;
  $("rdCamada").textContent = chavesTexto(camada);
  if (atual) {
    $("rdPasso").textContent = `${passo} de ${percurso.length - 1}`;
    $("rdPosicao").textContent = `(${atual[0]},${atual[1]})`;
    $("rdChaves").textContent = chavesTexto(atual[2]);
    $("rdBonus").textContent = atual[3].length ? atual[3].join(", ") : "nenhum";
    $("rdCusto").textContent = atual[4];
    $("rdEstado").textContent = `(${atual[0]},${atual[1]})|${atual[2]}|{${atual[3].join(",")}}`;
  } else {
    ["rdPasso", "rdPosicao", "rdChaves", "rdBonus", "rdCusto", "rdEstado"].forEach((id) => ($(id).textContent = "-"));
  }
}

function mostrarMensagem() {
  const msg = $("msg");
  const textos = {
    RECUSA: `Dijkstra recusou: ${resultado.mensagem}`,
    CICLO_NEGATIVO: `Ciclo negativo encontrado (custo ${resultado.custo_ciclo} por volta). ` +
      `A animacao mostra uma volta do ciclo; repetindo, o custo cai sem parar.`,
    SEM_SOLUCAO: `Nao existe caminho do inicio ate a saida. ` +
      `Ligue "Realcar estados-armadilha" para ver onde o jogador fica preso.`,
  };
  let texto = textos[resultado.status];
  if (resultado.status === "OK") {
    // so diz que chegou quando a animacao chega no ultimo passo
    if (passo === resultado.percurso.length - 1) {
      texto = `Chegou na saida em ${resultado.passos} passos, custo ${resultado.custo}.`;
    } else {
      texto = `Caminho encontrado: ${resultado.passos} passos, custo ${resultado.custo}. ` +
        `Use Play ou Passo > para acompanhar.`;
    }
    if ($("selAlg").value === "DFS") texto += " (a DFS nao garante o menor caminho)";
  }
  msg.textContent = texto;
  msg.hidden = false;
}

function escolherAlgoritmo() {
  parar();
  resultado = mapa.algoritmos[$("selAlg").value];
  passo = 0;
  desenhar();
}

function escolherMapa() {
  parar();
  mapa = DADOS[$("selMapa").value];

  $("selAlg").innerHTML = Object.keys(mapa.algoritmos)
    .map((alg) => `<option value="${alg}">${NOMES_ALG[alg] || alg}</option>`).join("");
  $("selCamada").innerHTML = `<option value="seguir">seguir o percurso</option>` +
    Object.keys(mapa.camadas).map((k) => `<option value="${k}">${chavesTexto(k)}</option>`).join("");

  montarGrade();
  escolherAlgoritmo();
}

function intervalo() {
  // milissegundos por passo: lenta 1000, normal 400, rapida 120, muito rapida 15
  return Number(document.querySelector('input[name="velocidade"]:checked').value);
}

function avancar() {
  if (passo < resultado.percurso.length - 1) {
    passo++;
    desenhar();
  } else {
    parar();
  }
}

function voltar() {
  if (passo > 0) {
    passo--;
    desenhar();
  }
}

function parar() {
  clearInterval(timer);
  timer = null;
  $("btnPlay").textContent = "Play";
}

function playPause() {
  if (timer) return parar();
  if (passo >= resultado.percurso.length - 1) passo = 0;
  $("btnPlay").textContent = "Pausar";
  timer = setInterval(avancar, intervalo());
}

function mudarVelocidade() {
  if (timer) {
    clearInterval(timer);
    timer = setInterval(avancar, intervalo());
  }
}

$("selMapa").innerHTML = Object.keys(DADOS)
  .map((nome) => `<option value="${nome}">${nome} - ${DADOS[nome].titulo}</option>`).join("");
$("selMapa").onchange = escolherMapa;
$("selAlg").onchange = escolherAlgoritmo;
$("selCamada").onchange = desenhar;
$("chkArmadilha").onchange = desenhar;
$("btnInicio").onclick = () => { parar(); passo = 0; desenhar(); };
$("btnVoltar").onclick = () => { parar(); voltar(); };
$("btnAvancar").onclick = () => { parar(); avancar(); };
$("btnPlay").onclick = playPause;
document.querySelectorAll('input[name="velocidade"]').forEach((r) => (r.onchange = mudarVelocidade));

if (Object.keys(DADOS).length === 0) {
  // este e o modelo (src/labirinto_template.html), sem dados
  document.body.insertAdjacentHTML("afterbegin",
    '<p class="msg">Sem dados: rode <code>python -m src.solve</code> e abra ' +
    '<code>out/parte1/labirinto_interativo.html</code> (ou <code>python -m src.cli --interactive</code>).</p>');
} else {
  if (MAPA_INICIAL in DADOS) $("selMapa").value = MAPA_INICIAL;
  escolherMapa();
}
</script>
</body>
</html>
